<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet" >
    <link 
      rel="stylesheet" 
      href="style.css"  
      media="screen" 
      charset="utf-8">
  </head>
  <body>
    <aside class="info additional-information">
      <img class="info__image" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix image">
      <a class="info__link more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </aside>
    <main class="main">
      <h1 class="main__title invisible">Todo app</h1>
      <section class="todo" id="top-section">
        <h2 class="todo__title" for="new-task">Add Item</h2>
        <div class="todo__container-task">
          <input 
            id="new-task"
            class="todo__new-task" 
            type="text">
          <button class="todo__button">Add</button>
        </div>
      </section>
      <section class="todo">
        <h2 class="todo__title">Todo</h2>
        <ul class="todo__list todo__list_incomplete" id="incomplete-tasks">
          <li class="todo__item">
            <input class="todo__input todo__checkbox" type="checkbox">
            <label class="todo__label">Pay Bills</label>
            <input type="text" class="todo__task">
            <button class="todo__button todo__button_edit">Edit</button>
            <button class="todo__button todo__button_delete">
              <img class="todo__button-img" alt="Delete" src="./remove.svg">
            </button>
          </li>
          <li class="todo__item todo__item_edit-mode">
            <input class="todo__input todo__checkbox" type="checkbox">
            <label class="todo__label">Go Shopping</label>
            <input 
              type="text" 
              value="Go Shopping" 
              class="todo__task">
            <button class="todo__button todo__button_edit">Save</button>
            <button class="todo__button todo__button_delete">
              <img class="todo__button-img" alt="Delete" src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>
      <section class="todo">
        <h2 class="todo__title">Completed</h2>
        <ul class="todo__list todo__list_complete" id="completed-tasks">
          <li class="todo__item">
            <input class="todo__input todo__checkbox" type="checkbox" checked>
            <label class="todo__label">See the Doctor</label>
            <input type="text" class="todo__task">
            <button class="todo__button todo__button_edit">Edit</button>
            <button class="todo__button todo__button_delete">
              <img class="todo__button-img" alt="Delete" src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script  src="app.js"></script>
  </body>
</html>
